<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Cabecera del sistema -->
    <header>
        <h1>RCS - Sistema de Cotización</h1>
    </header>

    <!-- Núcleo de la aplicación -->
    <main>
        <!-- Sección 1: El Formulario del cliente -->
        <section id="seccion-cotizador">
            <h2>Configura tu pedido</h2>
            <p>Selecciona las características de tus tazas sublimables.</p>

            <form id="form-cotizador">
                <!-- Selector de Categoría (Cargado dinámicamente) -->
                <div class="campo">
                    <label for="categoria">Categoría del Producto:</label>
                    <select id="categoria" required>
                        <option value="">Cargando categorías...</option>
                    </select>
                </div>

                <!-- Selector de Producto -->
                <div class="campo">
                    <label for="tipo-producto">Modelo de Producto:</label>
                    <select id="tipo-producto" required disabled>
                        <option value="">Selecciona primero una categoría</option>
                    </select>
                </div>

                <!-- Contenedor dinámico de adicionales -->
                <div id="contenedor-adicionales"></div>

                <!-- Campo de Cantidad -->
                <div class="campo">
                    <label for="cantidad">Cantidad deseada:</label>
                    <input type="number" id="cantidad" min="1" placeholder="Ej: 24" required>
                </div>
            </form>
        </section>

        <!-- Sección 2: El Panel donde se mostrará el precio final -->
        <section id="seccion-resultado">
            <h2>Resumen de Cotización</h2>
            <div id="pantalla-precio">
                <!-- Aquí JavaScript inyectará el precio mañana -->
                <p>Selecciona tus opciones para calcular el total.</p>
            </div>
        </section>
    </main>

    <!-- Pie de página profesional -->
    <footer>
        <p>&copy; 2026 RCS Merchandising. Todos los derechos reservados.</p>
    </footer>

    <!-- Conexión con el cerebro de la aplicación -->
    <script src="script.js"></script>
</body>
</body>

</html>
